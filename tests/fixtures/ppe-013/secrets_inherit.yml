# Rule 13: secrets: inherit to a workflow in another repository.
#
# Expected: 2 findings, both PPE-013, both Block.
#
# secrets: inherit hands every secret in the repository to the called workflow.
# The explicit form names each one and can be checked. The inherit form says
# "everything", and what everything is depends on the secret store, which is not
# in this file.
#
# The references are SHA pinned so that rule 1 stays quiet. This fixture is
# about the secrets and not about the pinning, and a rule 1 finding on the same
# line would say nothing about which rule was being tested.
name: secrets inherit
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A finding. The called workflow is in another repository, so it is code this
  # tool cannot read, and it is being handed every secret the repository has.
  third-party:
    uses: some-org/their-workflow/.github/workflows/build.yml@0123456789abcdef0123456789abcdef01234567
    secrets: inherit

  # A finding, and the same reason. A workflow in this organisation is still a
  # different repository, and a workflow in the same organisation can itself
  # call a third party workflow and pass the secrets on.
  same-org:
    uses: our-org/shared-workflows/.github/workflows/build.yml@0123456789abcdef0123456789abcdef01234567
    secrets: inherit

  # Not a finding. The called workflow is in this repository, so it is code the
  # reader can already see, and inherit is a reasonable way to pass secrets
  # between two workflows one team owns.
  local:
    uses: ./.github/workflows/inner.yml
    secrets: inherit

  # Not a finding. The explicit form names what leaves, and that can be checked
  # against what the called workflow uses. This is the shape the finding asks
  # for.
  explicit:
    uses: some-org/their-workflow/.github/workflows/build.yml@0123456789abcdef0123456789abcdef01234567
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
