name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow token only reads the repository. Nothing here writes to it, and
# the release workflow has its own job with write access.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

  scan:
    name: piplyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The action, on this repository's own workflows. It is the same check
      # every user of the action gets, run against the repository that ships
      # it.
      #
      # The action downloads the published release rather than building from
      # source, so what is checked here is what users actually run. A release
      # that does not build, or an action that downloads a release that is not
      # there, is caught in this repository rather than at somebody else's
      # install.
      #
      # It is pinned to the commit the v0.1.1 tag points at, the same way the
      # other actions here are pinned. That commit's action.yml has v0.1.1 as
      # the version it downloads, so the action and the binary it fetches are
      # the same release.
      - uses: Vibrouz/whoa@a0bcef2c5495bd3894e6807b63892c7c5719bb56 # v0.1.1
