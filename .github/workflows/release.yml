name: Release
on:
  push:
    tags: ['v*']

# The release is created with the workflow token, which is the only credential a
# release needs. It can write to this repository and nothing else.
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - name: Check the tag matches the action
        shell: bash
        run: |
          set -euo pipefail
          # The action's default version is the one it downloads, so the tag
          # and the version have to be the same release. Checking it here is
          # what makes them unable to drift: a tag that does not match the
          # action would publish a release the action does not know how to
          # fetch, and the failure would be at somebody else's install.
          #
          # The version is read from the version input specifically rather
          # than from the first default that looks like a version, so that
          # another input cannot break this by having a default that happens
          # to start with a v.
          version=$(awk '
            /^  version:/ { in_version = 1; next }
            in_version && /^    default:/ { print $2; exit }
            in_version && /^  [a-z_]+:/ { in_version = 0 }
          ' action.yml)
          if [ -z "$version" ]; then
            echo "::error::no version found in the version input of action.yml" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the action's version ${version}" >&2
            echo "::error::update the default in action.yml and commit it before tagging" >&2
            exit 1
          fi

          # The reusable workflow names a release too, and it has to be this
          # release. The workflow is what a caller runs, so a workflow
          # pointing at a different release would have the caller running
          # one version's action against another version's rules.
          if [ ! -f .github/workflows/piplyzer.yml ]; then
            echo "::error::.github/workflows/piplyzer.yml is missing" >&2
            exit 1
          fi
          workflow_version=$(awk '
            /^[[:space:]]*#/ { next }
            /^[[:space:]]+version:[[:space:]]+v/ {
              sub(/.*version:[[:space:]]+/, "")
              sub(/[[:space:]].*$/, "")
              print
              exit
            }
          ' .github/workflows/piplyzer.yml)
          if [ -z "$workflow_version" ]; then
            echo "::error::no version found in the reusable workflow" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "$workflow_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the reusable workflow's version ${workflow_version}" >&2
            echo "::error::update the version in .github/workflows/piplyzer.yml and commit it before tagging" >&2
            exit 1
          fi
          echo "piplyzer: releasing ${version}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # CGO off so the binary is static, and the version stamped in so
          # "piplyzer --version" says which release it is.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "piplyzer-linux-${arch}" ./cmd/ppe
          done
          ls -l piplyzer-linux-*

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --verify-tag because the tag has to already exist. Without it gh
          # would create one from the default branch, which would publish a
          # release whose tag points at code that was never tagged.
          #
          # The notes carry the commit, because that is what a caller has to
          # pin. A tag would be easier to write and piplyzer's own rule 1 blocks
          # it, and a caller who has not installed piplyzer has nothing stopping
          # them writing one. Putting the commit in the notes is the
          # difference between the setup being a copy and paste and the
          # setup being a hunt through the repository.
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "piplyzer ${GITHUB_REF_NAME}.

          The reusable workflow, for a caller who wants the check and nothing else:

            uses: Vibrouz/piplyzer/.github/workflows/piplyzer.yml@${GITHUB_SHA}

          The action, for a caller who wants the check inside a job they control:

            uses: Vibrouz/piplyzer@${GITHUB_SHA}" \
            piplyzer-linux-amd64 piplyzer-linux-arm64
