# The piplyzer scan, as a reusable workflow.
#
# A caller needs three lines and nothing else:
#
#   name: piplyzer
#   on: pull_request
#   jobs:
#     piplyzer:
#       uses: Vibrouz/whoa/.github/workflows/piplyzer.yml@<commit sha>
#
# and a ruleset on the branch that requires this check. The check is named
# after the job below, so it does not depend on what the caller chose to
# call their job, and a caller cannot rename it.
#
# The commit is the one in the release notes for the version you want. A
# tag would be easier to write and piplyzer's own rule 1 blocks it, because a
# tag can be moved to point at code nobody reviewed, and refusing to be
# fooled by a moved tag is the entire reason this tool exists. A caller
# who has not installed piplyzer in their own repository has nothing to stop
# them writing a tag, so the rule is not the only thing standing between
# them and a moved tag.
#
# This file lives here, in this repository, and not in the caller's. That is
# the point. A caller cannot edit the steps, cannot take the checkout away,
# and cannot put continue-on-error on the job, because that keyword is not
# accepted on a reusable workflow call and GitHub rejects the file outright.
#
# What a caller can do is set if: false on the call, which skips the job,
# and GitHub reports a skipped job as a success. That hole is real. It is
# what the organization ruleset path is for: a ruleset can require a
# workflow from a source repository that is not the caller's, which is
# outside the caller's reach.
#
# The events. workflow_call is how a caller runs this. pull_request is how
# this runs against its own repository, and it is what an organization
# ruleset requires. merge_group is the merge queue, which is not used here,
# but it costs nothing to leave in and it is one less thing to add later.
on:
  workflow_call:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  scan:
    # if: true is deliberate and is not decoration. A workflow required by
    # an organization ruleset runs against a repository that is not the one
    # it lives in, and a job with no condition does not run there. GitHub's
    # own remedy for this is a condition that is always true.
    if: true
    runs-on: ubuntu-latest
    steps:
      # The checkout is here rather than in the caller, so that what gets
      # scanned is the pull request's own code no matter what the caller
      # did. A scanner that reads the working tree does not need the
      # caller's checkout settings, and a caller writing three lines
      # instead of eight is worth more than those settings are.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The action, pinned by commit, with the release it downloads given
      # separately.
      #
      # Pinning by commit is what rule 1 asks for and what it should ask
      # for. A tag can be moved, and a moved tag runs code that nobody
      # reviewed, so the two things are split: the downloader is pinned
      # because it is code that runs, and the version is an input because
      # it is a release to fetch. The downloader does not change, so its
      # commit does not either, and the version moves on every release.
      - uses: Vibrouz/whoa@1697676cdcebe8bf2626e96e741727d26040174c
        with:
          version: v0.2.0
