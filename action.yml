name: ppe
description: Scan GitHub Actions workflows and npm lockfiles for supply chain attack patterns.
author: Vibrouz

inputs:
  version:
    description: The ppe release to run.
    required: false
    default: v0.1.2

runs:
  using: composite
  steps:
    - name: Download ppe
      shell: bash
      env:
        # github.action_ref and github.action_repository are only available
        # through the env context of a composite action, not in a run keyword.
        PPE_VERSION: ${{ inputs.version }}
        PPE_REPOSITORY: ${{ github.action_repository }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "$RUNNER_ARCH" in
          X64)  asset="ppe-linux-amd64" ;;
          ARM64) asset="ppe-linux-arm64" ;;
          *) echo "ppe: unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        url="https://github.com/${PPE_REPOSITORY}/releases/download/${PPE_VERSION}/${asset}"
        echo "ppe: downloading ${url}"
        curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/ppe" "$url"
        chmod +x "${RUNNER_TEMP}/ppe"

    - name: Scan workflows
      shell: bash
      run: |
        set -euo pipefail
        # A repository with no workflows is a repository the scan has nothing
        # to say about, which is different from a repository whose workflows
        # are clean.
        #
        # The scan exits 2 when it finds nothing to check, and that is the
        # right behaviour for a path a person typed: a mistyped path must not
        # look like a clean repository. Here the path is not a person's, it is
        # the workspace, and the two cases have to be told apart by whether a
        # workflow directory exists at all.
        #
        # The search is for any .github/workflows directory, not just one at
        # the top. A caller who checked out into a subdirectory has the
        # workflows somewhere below the workspace, and a check that only
        # looked at the top would skip them and report a clean result for
        # workflows it never read.
        if [ -z "$(find . -type d -name workflows -path '*/.github/workflows' -print -quit)" ]; then
          echo "ppe: no .github/workflows directory, skipping the workflow scan"
          exit 0
        fi
        "${RUNNER_TEMP}/ppe" scan .

    - name: Check dependencies
      shell: bash
      run: |
        set -euo pipefail
        # A repository with no npm dependencies has no lockfile to check, and
        # the check exits 2 when there is nothing to read. Skipping it here
        # keeps the action usable on a repository that is not a JavaScript
        # project, which is most of them.
        if [ ! -f package-lock.json ]; then
          echo "ppe: no package-lock.json, skipping the dependency check"
          exit 0
        fi
        "${RUNNER_TEMP}/ppe" deps .
